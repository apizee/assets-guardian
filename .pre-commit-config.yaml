default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: \.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commit
        stages: [commit-msg]
        args: [--strict, feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks
        args: [--config=.gitleaks.toml]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/

      - id: bandit
        name: bandit
        entry: uv run --no-sync bandit -c pyproject.toml
        language: system
        types: [python]
        files: ^src/

      - id: radon
        name: radon (complexity)
        entry: bash -c 'out=$(uv run --no-sync radon cc -n C -s --no-assert "$@"); [ -z "$out" ] || { echo "$out"; exit 1; }' --
        language: system
        types: [python]
        files: ^src/

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy --config-file=pyproject.toml src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: dependency-audit
        name: dependency-audit
        entry: uvx pip-audit
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [pre-push]
