stages:
  - init
  - test
  - build
  - deploy
  - purge

variables:
  # If GitLab uses a self-signed certificate, prefer injecting the CA in runners (CI_SERVER_TLS_CA_FILE) rather than disabling SSL verification
  # GIT_SSL_NO_VERIFY: "true"

  DOCKER_VERSION: "27"
  ALPINE_VERSION: "3.21"
  UV_IMAGE: "ghcr.io/astral-sh/uv:python3.13-bookworm-slim"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.14.0-debian"
  TRIVY_IMAGE: "aquasec/trivy:0.72.0"
  TRUFFLEHOG_VERSION: "v3.94.2"
  REGCLIENT_VERSION: "v0.8.0"

  BRANCH_MAIN: main
  BRANCH_DEV: dev

default:
  artifacts:
    expire_in: 30 days

check-variables:
  stage: init
  allow_failure: false
  image: alpine:${ALPINE_VERSION}
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      missing=""
      [ -z "${REGISTRY_URL}" ] && missing="$missing REGISTRY_URL"
      [ -z "${REGISTRY_USER}" ] && missing="$missing REGISTRY_USER"
      [ -z "${REGISTRY_PASSWORD}" ] && missing="$missing REGISTRY_PASSWORD"
      [ -z "${IMAGE_REFERENCE}" ] && missing="$missing IMAGE_REFERENCE"
      if [ -n "$missing" ]; then
        echo "Missing required variables:$missing"
        exit 1
      fi

check-tag-format:
  stage: init
  allow_failure: false
  image: alpine:${ALPINE_VERSION}
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      if ! echo "${CI_COMMIT_TAG}" | grep -q -E "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$"; then
        echo "Tag ${CI_COMMIT_TAG} is not a valid semantic versioning tag (expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN)"
        exit 1
      fi
  needs:
    - check-variables

check-version-match:
  stage: init
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      PROJECT_VERSION="$(uv version --short)"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      TAG_BASE="$(echo "${TAG_VERSION}" | sed -E 's/-rc[0-9]+$//')"
      if [ "${TAG_BASE}" != "${PROJECT_VERSION}" ]; then
        echo "Tag (${CI_COMMIT_TAG}) does not match pyproject.toml version (${PROJECT_VERSION})"
        echo "Bump the version first ('make version-bump') then tag."
        exit 1
      fi
      echo "Version match: tag (${CI_COMMIT_TAG}) and pyproject.toml (${PROJECT_VERSION}) agree"
  needs:
    - check-tag-format

test-secret-detection-gitleaks:
  stage: test
  allow_failure: true
  image:
    name: ${GITLEAKS_IMAGE}
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  script:
    - gitleaks --version
    - gitleaks detect
        --source="$CI_PROJECT_DIR"
        --config="$CI_PROJECT_DIR/.gitleaks.toml"
        --report-path="$CI_PROJECT_DIR/gitleaks-report.json"
        --report-format=json
        --verbose
        --redact
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

test-secret-detection-trufflehog:
  stage: test
  allow_failure: true
  image: alpine:${ALPINE_VERSION}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - apk add --no-cache curl jq bash
    - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh | sh -s -- -b /usr/local/bin ${TRUFFLEHOG_VERSION}
    - trufflehog --version
  script:
    - set -o pipefail
    - trufflehog filesystem . --only-verified --fail --json | jq -r '.[]?'
    - echo "No secrets found"

test-hadolint:
  stage: test
  allow_failure: false
  image: ${HADOLINT_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - hadolint --version
  script:
    - hadolint Dockerfile
  needs:
    - test-secret-detection-gitleaks
    - test-secret-detection-trufflehog

test-lint:
  stage: test
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - uv sync --frozen
  script:
    - uv run ruff check src/ tests/
    - uv run ruff format --check src/ tests/
    - uv run mypy --config-file=pyproject.toml
  needs:
    - test-secret-detection-gitleaks
    - test-secret-detection-trufflehog

test-radon:
  stage: test
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - uv sync --frozen
  script:
    - uv run radon cc src/ -a -s
    - |
      if uv run radon cc src/ -n C -s --no-assert | grep -q .; then
        echo "Code complexity exceeds the acceptable threshold (>= C)"
        exit 1
      fi
  needs:
    - test-lint
    - test-hadolint

test-bandit:
  stage: test
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - uv sync --frozen
  script:
    - uv run bandit -c pyproject.toml -r src/
  needs:
    - test-lint
    - test-hadolint

test-dependency-audit:
  stage: test
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  script:
    - uv export --frozen --no-dev --no-emit-project --quiet --format requirements-txt -o requirements-audit.txt
    - uvx pip-audit --vulnerability-service pypi -r requirements-audit.txt --require-hashes --disable-pip
  needs:
    - test-lint
    - test-hadolint

test-pytest:
  stage: test
  allow_failure: false
  image: ${UV_IMAGE}
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_MAIN'
    - if: '$CI_COMMIT_BRANCH == $BRANCH_DEV'
  before_script:
    - uv sync --frozen
  script:
    - uv run pytest --cov --cov-report=term-missing
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  needs:
    - test-radon
    - test-bandit
    - test-dependency-audit

build-docker-image:
  stage: build
  image: docker:${DOCKER_VERSION}
  rules:
    - if: '$CI_COMMIT_TAG'
  services:
    - docker:${DOCKER_VERSION}-dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker build --build-arg VERSION=${VERSION} --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -t ${CI_REGISTRY_IMAGE}:tmp .
    - docker push ${CI_REGISTRY_IMAGE}:tmp
    - echo "Docker image pushed to local registry for Trivy scan"

scan-docker-image:
  stage: build
  allow_failure: false
  image:
    name: ${TRIVY_IMAGE}
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GIT_STRATEGY: fetch
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE:tmp
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - trivy --version
  script:
    - trivy image --download-db-only
    - trivy image --exit-code 0 --scanners vuln --format template --template "@/contrib/gitlab.tpl" --output "$CI_PROJECT_DIR/trivy-container-scanning-report.json" "$FULL_IMAGE_NAME"
    - trivy image --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignorefile "$CI_PROJECT_DIR/.trivyignore.yml" --show-suppressed "$FULL_IMAGE_NAME"
  artifacts:
    when: always
    expire_in: 90 days
    reports:
      container_scanning: trivy-container-scanning-report.json
  needs:
    - build-docker-image

push-docker-image:
  stage: deploy
  image: docker:${DOCKER_VERSION}
  rules:
    - if: '$CI_COMMIT_TAG'
  services:
    - docker:${DOCKER_VERSION}-dind
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
    - docker pull ${CI_REGISTRY_IMAGE}:tmp
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "${REGISTRY_PASSWORD}" | docker login ${REGISTRY_URL} -u "${REGISTRY_USER}" --password-stdin
    - docker tag ${CI_REGISTRY_IMAGE}:tmp ${IMAGE_REFERENCE}:${VERSION}
    - docker push ${IMAGE_REFERENCE}:${VERSION}
    - echo "Pushed ${IMAGE_REFERENCE}:${VERSION}"

purge-docker-image:
  stage: purge
  rules:
    - if: '$CI_COMMIT_TAG'
  image: alpine:${ALPINE_VERSION}
  before_script:
    - apk update && apk add curl
    - curl --fail-with-body --location "https://github.com/regclient/regclient/releases/download/${REGCLIENT_VERSION}/regctl-linux-amd64" > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
  script:
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm ${CI_REGISTRY_IMAGE}:tmp
    - echo "Temporary image purged from local registry"
